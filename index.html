<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1d33">
<title>الجفائرى | مواد البناء والورش</title>
<style>
:root{--navy:#0b1d33;--gold:#c79b32;--gold-soft:#fbf5e6;--border:#e7e4db;--text:#0b1d33}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#f7f7f6;color:var(--text);font-family:Tahoma,Arial,sans-serif}
.page{width:min(100%,720px);margin:auto;background:#fff;min-height:100vh;padding:0 32px 28px;border-radius:0 0 42px 42px;box-shadow:0 0 30px rgba(0,0,0,.08)}
.hero-photo{padding-top:0;text-align:center}
.hero-photo img{width:min(78%,360px);height:300px;object-fit:cover;border-radius:0 0 42px 42px;box-shadow:0 12px 30px rgba(0,0,0,.18);display:block;margin:auto}
h1{font-size:48px;line-height:1.1;text-align:center;margin:56px 0 10px;font-weight:800}
.tag{text-align:center;color:var(--gold);font-size:23px;font-weight:800;line-height:1.55;margin-bottom:32px}
.address{border:1.5px solid var(--border);background:#fffdfa;border-radius:28px;padding:25px 28px;display:flex;align-items:center;gap:18px;justify-content:center;text-align:center;font-size:22px;line-height:1.75}
.pin{color:var(--gold);font-size:34px;flex:0 0 auto}
.map{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none;border-radius:22px;padding:17px 20px;font-size:23px;font-weight:800}
.divider{height:5px;width:108px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:44px auto 36px}
.links{display:flex;flex-direction:column;gap:22px}
.link{min-height:116px;border:1.5px solid var(--border);border-radius:28px;background:#fff;display:flex;align-items:center;text-decoration:none;color:var(--text);padding:18px 20px}
.icon{width:62px;height:62px;border-radius:20px;background:#f8f4e8;display:flex;align-items:center;justify-content:center;flex:0 0 62px}.icon svg{width:32px;height:32px;display:block}.icon.phone svg{fill:#25D366}.icon.facebook svg{fill:#1877F2}.icon.whatsapp svg{fill:#25D366}.icon.tiktok svg{overflow:visible}.icon.tiktok .cyan{fill:#25F4EE}.icon.tiktok .pink{fill:#FE2C55}.icon.tiktok .black{fill:#111}
.label{flex:1;text-align:center;font-size:25px;font-weight:800}
.arrow{color:#9da5ad;font-size:30px;flex:0 0 40px;text-align:left}
.footer{text-align:center;margin-top:48px;color:#888;font-size:19px}
.footer b{color:var(--gold)}
@media(max-width:520px){
 .page{padding:0 22px 25px;border-radius:0 0 35px 35px}
 .hero-photo img{width:78%;height:245px;border-radius:0 0 35px 35px}
 h1{font-size:39px;margin-top:45px}
 .tag{font-size:18px;margin-bottom:27px}
 .address{font-size:18px;padding:20px 18px}
 .map{font-size:18px;padding:15px}
 .divider{margin:35px auto 30px}
 .link{min-height:100px;border-radius:24px}
 .icon{width:54px;height:54px;flex-basis:54px;border-radius:17px;font-size:27px}
 .label{font-size:21px}
 .arrow{font-size:26px}
 .footer{font-size:15px}
}
</style>
</head>
